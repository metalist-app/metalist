<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- No-cache headers for development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>${page_title}</title>
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/static/img/favicon.ico?v=${asset_version}">
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg?v=${asset_version}">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v=${asset_version}">
    <link rel="manifest" href="/static/manifest.json?v=${asset_version}">
    <%doc>Scripts and stylesheets come from this version's folder, which the browser keeps until
    the version changes (app/services/static_files_version.py). The import map sends code that
    names /static/js/ to the same folder, so each module loads once, from one address.</%doc>
    <script type="importmap" nonce="${request.state.csp_nonce}">{"imports": {"/static/js/": "/static/v/${asset_version}/js/"}}</script>
    <link rel="stylesheet" href="/static/v/${asset_version}/css/main.css">
    <link rel="stylesheet" href="/static/v/${asset_version}/css/forms.css">
    <link rel="stylesheet" href="/static/v/${asset_version}/css/skins/illuminated.css">
    <link rel="stylesheet" href="/static/v/${asset_version}/css/skins/fathom.css">
    <link rel="stylesheet" href="/static/v/${asset_version}/css/skins/phosphor.css">
    <link rel="stylesheet" href="/static/v/${asset_version}/css/skins/vellum.css">
</head>
<body>
    ${self.body()}
    <script src="/static/v/${asset_version}/js/vendor/dompurify-3.4.17.min.js"></script>
    <script type="module" src="/static/v/${asset_version}/js/main.js"></script>
</body>
</html>
